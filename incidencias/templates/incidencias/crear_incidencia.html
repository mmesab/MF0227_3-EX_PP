{% extends 'incidencias/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3 text-center">Registrar Nueva Incidencia</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Guardar Incidencia</button>
            </form>
            <a href="{% url 'lista_incidencias' %}" class="btn btn-secondary w-100 mt-2">Volver al listado</a>
        </div>
    </div>
</div>
{% endblock %}
